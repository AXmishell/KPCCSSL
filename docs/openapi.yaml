openapi: 3.1.0
info:
  title: KPCCSSL API
  version: 0.1.0
  description: |
    Self-hosted ACME certificate manager. Session authentication uses an
    HttpOnly cookie; every mutating request additionally requires the
    `X-CSRF-Token` value returned by `/auth/login` or `/me`.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /system/health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Liveness
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }
                  setup_required: { type: boolean }
  /system/ready:
    get:
      security: []
      operationId: ready
      description: Readiness probe (database, data directory and acme.sh binary). Also exposes Prometheus text metrics at the unprefixed `/metrics` endpoint.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "503": { $ref: "#/components/responses/Problem" }
  /setup:
    post:
      security: []
      operationId: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        "201": { $ref: "#/components/responses/AuthResult" }
        "400": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                totp_code: { type: string }
                recovery_code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
  /me:
    get:
      operationId: me
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
  /me/step-up:
    post:
      operationId: stepUp
      description: Re-authenticate the current session for private-key downloads. Returns a short-lived, session-bound token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp_code: { type: string }
                recovery_code: { type: string }
      responses:
        "200":
          description: Step-up grant
          content:
            application/json:
              schema:
                type: object
                properties:
                  step_up_token: { type: string }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
  /me/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: Password changed }
        "401": { $ref: "#/components/responses/Problem" }
  /me/totp/setup:
    post:
      operationId: totpSetup
      responses:
        "200":
          description: New TOTP secret and otpauth URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  uri: { type: string }
  /me/totp/enable:
    post:
      operationId: totpEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code, password]
              properties:
                secret: { type: string }
                code: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Recovery codes (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
  /me/totp/disable:
    post:
      operationId: totpDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "204": { description: Disabled }
  /dashboard:
    get:
      operationId: dashboard
      responses:
        "200":
          description: Dashboard counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates:
                    type: object
                    additionalProperties: { type: integer }
                  jobs:
                    type: object
                    additionalProperties: { type: integer }
                  recent_jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
  /certificates:
    get:
      operationId: listCertificates
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: [string, integer] }, description: "Composite `<created_at>:<id>` cursor or legacy integer." }
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Certificate" }
                  next_cursor: { type: [string, integer, "null"], description: "Composite `<created_at>:<id>` cursor (the legacy integer form is also accepted)." }
    post:
      operationId: createCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateInput" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "422": { $ref: "#/components/responses/Problem" }
  /certificates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCertificate
      responses:
        "200":
          description: Certificate detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { $ref: "#/components/schemas/Certificate" }
                  current_revision: { $ref: "#/components/schemas/Revision" }
    patch:
      operationId: updateCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCertificate
      responses:
        "204": { description: Soft-deleted }
  /certificates/{id}/issue:
    post:
      operationId: issueCertificate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /certificates/{id}/renew:
    post:
      operationId: renewCertificate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /certificates/{id}/revoke:
    post:
      operationId: revokeCertificate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /certificates/{id}/revisions:
    get:
      operationId: listRevisions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Revision" }
  /certificates/{id}/events:
    get:
      operationId: listCertificateEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
      responses:
        "200":
          description: Certificate timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CertificateEvent" }
  /certificates/{id}/download:
    get:
      operationId: downloadCertificate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [pem, zip] }, description: "ZIP contains the private key and requires a step-up grant" }
        - { name: revision, in: query, schema: { type: string } }
        - { name: key, in: query, schema: { type: boolean }, description: "Include the private key; requires a step-up grant" }
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "200": { description: Binary file }
        "428": { $ref: "#/components/responses/Problem" }
    post:
      operationId: exportPFX
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
                revision: { type: string }
      responses:
        "200": { description: PKCS#12 file }
        "428": { $ref: "#/components/responses/Problem" }
  /jobs:
    get:
      operationId: listJobs
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: certificate_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
  /jobs/{id}:
    get:
      operationId: getJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /jobs/{id}/events:
    get:
      operationId: jobEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: |
            Server-sent events: `job.log` (id = sequence), `job.status`, `job.done`.
            Supports Last-Event-ID and `?after=`.
          content:
            text/event-stream:
              schema: { type: string }
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Canceled }
        "409": { $ref: "#/components/responses/Problem" }
  /jobs/{id}/retry:
    post:
      operationId: retryJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Re-queued }
        "409": { $ref: "#/components/responses/Problem" }
  /jobs/{id}/log:
    get:
      operationId: downloadJobLog
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Raw job log (admin only)
          content:
            text/plain:
              schema: { type: string }
  /ca-accounts:
    get:
      operationId: listCAAccounts
      responses:
        "200":
          description: CA accounts and presets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CAAccount" }
                  presets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        directory_url: { type: string }
                        needs_eab: { type: boolean }
    post:
      operationId: createCAAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAAccount" }
  /ca-accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCAAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAAccount" }
    delete:
      operationId: deleteCAAccount
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /ca-accounts/{id}/register:
    post:
      operationId: registerCAAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /ca-accounts/{id}/disable:
    post:
      operationId: disableCAAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAAccount" }
  /ca-accounts/{id}/enable:
    post:
      operationId: enableCAAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Enabled (registration required again)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAAccount" }
  /dns-providers:
    get:
      operationId: listDNSProviders
      responses:
        "200":
          description: Static provider catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSProvider" }
  /dns-credentials:
    get:
      operationId: listDNSCredentials
      responses:
        "200":
          description: Masked credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSCredential" }
    post:
      operationId: createDNSCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, config]
              properties:
                name: { type: string }
                provider: { type: string }
                config:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSCredential" }
  /dns-credentials/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateDNSCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                provider: { type: string }
                config:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSCredential" }
    delete:
      operationId: deleteDNSCredential
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /dns-credentials/{id}/verify:
    post:
      operationId: verifyDNSCredential
      description: Local decryption/field validation; not a live provider API call.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSCredential" }
        "422": { $ref: "#/components/responses/Problem" }
  /deployments:
    get:
      operationId: listDeployments
      parameters:
        - { name: certificate_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Deployment" }
    post:
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
  /deployments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
    delete:
      operationId: deleteDeployment
      responses:
        "204": { description: Deleted }
  /deployments/test:
    post:
      operationId: testDeploymentConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, config]
              properties:
                type: { type: string }
                config: { type: object, additionalProperties: true }
      responses:
        "204": { description: Connection test succeeded }
        "400": { $ref: "#/components/responses/Problem" }
  /deployments/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: testDeployment
      responses:
        "204": { description: Connection test succeeded }
        "400": { $ref: "#/components/responses/Problem" }
  /deployment-credentials:
    get:
      operationId: listDeploymentCredentials
      responses:
        "200":
          description: Deployment credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DeploymentCredential" }
                  types:
                    type: array
                    items: { type: string }
    post:
      operationId: createDeploymentCredential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentCredentialInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentCredential" }
        "422": { $ref: "#/components/responses/Problem" }
  /deployment-credentials/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateDeploymentCredential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentCredentialInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentCredential" }
    delete:
      operationId: deleteDeploymentCredential
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /deployment-credentials/test:
    post:
      operationId: testDeploymentCredentialConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, config]
              properties:
                type: { type: string }
                config: { type: object, additionalProperties: true }
      responses:
        "204": { description: Connection test succeeded }
        "400": { $ref: "#/components/responses/Problem" }
  /deployment-credentials/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: testDeploymentCredential
      responses:
        "204": { description: Connection test succeeded }
        "400": { $ref: "#/components/responses/Problem" }
  /notification-channels:
    get:
      operationId: listNotificationChannels
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationChannel" }
                  events:
                    type: array
                    items: { type: string }
  /notification-channels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateNotificationChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string }
                config: { type: object, additionalProperties: true }
                events:
                  type: array
                  items: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
    delete:
      operationId: deleteNotificationChannel
      responses:
        "204": { description: Deleted }
  /notification-channels/{id}/test:
    post:
      operationId: testNotificationChannel
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Test message sent }
        "502": { $ref: "#/components/responses/Problem" }
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string }
                password: { type: string }
                role: { type: string, enum: [admin, operator, viewer] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /users/{id}:
    patch:
      operationId: updateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, operator, viewer] }
                disabled: { type: boolean }
                password: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /workflows:
    get:
      operationId: listWorkflows
      responses:
        "200":
          description: Workflow definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Workflow" }
    post:
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "422": { $ref: "#/components/responses/Problem" }
  /workflows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getWorkflow
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
    patch:
      operationId: updateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
    delete:
      operationId: deleteWorkflow
      responses:
        "204": { description: Deleted }
  /workflows/{id}/run:
    post:
      operationId: runWorkflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Workflow queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
        "409": { $ref: "#/components/responses/Problem" }
  /workflows/{id}/runs:
    get:
      operationId: listWorkflowRuns
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowRun" }
  /workflow-runs/{id}:
    get:
      operationId: getWorkflowRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Run with step timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRunDetail" }
  /workflow-runs/{id}/cancel:
    post:
      operationId: cancelWorkflowRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Canceled }
        "409": { $ref: "#/components/responses/Problem" }
  /workflow-runs/{id}/log:
    get:
      operationId: downloadWorkflowLog
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Workflow run log
          content:
            text/plain:
              schema: { type: string }
  /audit-logs:
    get:
      operationId: listAuditLogs
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLog" }
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /system/info:
    get:
      operationId: systemInfo
      responses:
        "200":
          description: Version, disk and acme.sh information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  acme_version: { type: string }
                  setup_required: { type: boolean }
                  data_dir: { type: string }
                  disk_free_bytes: { type: integer }
                  server_time: { type: integer }
                  fake_acme: { type: boolean }
                  instance_name: { type: string }
                  default_ca_id: { type: string }
                  default_theme: { type: string, enum: [light, dark] }
                  renewal_notice_days: { type: integer }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kpccssl_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 128 }
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      description: Short-lived token returned by POST /me/step-up.
      schema: { type: string }
  responses:
    AuthResult:
      description: Authenticated user and CSRF token
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: "#/components/schemas/User" }
              csrf_token: { type: string }
    Accepted:
      description: Asynchronous job accepted
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id: { type: string }
    Problem:
      description: RFC 7807 problem document
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        disabled: { type: boolean }
        totp_enabled: { type: boolean }
        created_at: { type: integer }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
    Certificate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        primary_domain: { type: string }
        san:
          type: array
          items: { type: string }
        key_type: { type: string, enum: [ec-256, ec-384, rsa-2048, rsa-3072, rsa-4096] }
        ca_account_id: { type: string }
        challenge_type: { type: string, enum: [dns-01, http-01-webroot, http-01-standalone, tls-alpn-01] }
        dns_credential_id: { type: [string, "null"] }
        webroot: { type: [string, "null"] }
        auto_renew: { type: boolean }
        status: { type: string, enum: [draft, queued, issuing, active, renewing, failed, revoked, disabled] }
        current_revision_id: { type: [string, "null"] }
        next_renew_at: { type: [integer, "null"] }
        last_error_code: { type: [string, "null"] }
        last_error_message: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: integer }
        updated_at: { type: integer }
    CertificateInput:
      type: object
      required: [primary_domain, key_type, ca_account_id, challenge_type]
      properties:
        name: { type: string }
        primary_domain: { type: string }
        san:
          type: array
          items: { type: string }
        key_type: { type: string }
        ca_account_id: { type: string }
        challenge_type: { type: string }
        dns_credential_id: { type: string }
        webroot: { type: string }
        options:
          type: object
          properties:
            preferred_chain: { type: string }
            dns_alias: { type: string }
            dns_sleep: { type: integer }
            always_new_key: { type: boolean }
            must_staple: { type: boolean }
        auto_renew: { type: boolean }
        version: { type: integer }
    CertificateEvent:
      type: object
      properties:
        id: { type: integer }
        certificate_id: { type: string }
        type: { type: string }
        message: { type: [string, "null"] }
        job_id: { type: [string, "null"] }
        created_at: { type: integer }
    Revision:
      type: object
      properties:
        id: { type: string }
        certificate_id: { type: string }
        serial: { type: string }
        fingerprint_sha256: { type: string }
        not_before: { type: integer }
        not_after: { type: integer }
        issued_at: { type: integer }
    Job:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [register_account, issue, renew, revoke, deploy, sync] }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled, interrupted] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        certificate_id: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
        created_at: { type: integer }
        started_at: { type: [integer, "null"] }
        finished_at: { type: [integer, "null"] }
    CAAccount:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        directory_url: { type: string }
        email: { type: [string, "null"] }
        eab_kid: { type: [string, "null"] }
        tos_accepted_at: { type: [integer, "null"] }
        status: { type: string, enum: [new, registered, error, disabled] }
        last_error: { type: [string, "null"] }
    CAInput:
      type: object
      required: [name, directory_url]
      properties:
        name: { type: string }
        directory_url: { type: string }
        email: { type: string }
        eab_kid: { type: string }
        eab_hmac_key: { type: string }
        tos_accepted: { type: boolean }
    DNSProvider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        docs: { type: string }
        min_role: { type: string }
        wildcard: { type: boolean }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              secret: { type: boolean }
              required: { type: boolean }
              help: { type: string }
    DNSCredential:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        status: { type: string, enum: [unverified, ok, error] }
        last_error: { type: [string, "null"] }
        last_used_at: { type: [integer, "null"] }
        configured_fields:
          type: array
          items: { type: string }
    Deployment:
      type: object
      properties:
        id: { type: string }
        certificate_id: { type: string }
        name: { type: string }
        type:
          type: string
          enum:
            - local_file
            - reload
            - webhook
            - ssh
            - baota_panel
            - baota_site
            - 1panel_panel
            - 1panel_site
            - tencent_cdn
            - tencent_waf
            - tencent_cos
            - tencent_teo
            - aliyun_cdn
            - aliyun_waf
            - aliyun_oss
            - aliyun_dcdn
            - qiniu_cdn
        credential_id: { type: [string, "null"] }
        enabled: { type: boolean }
        last_run_at: { type: [integer, "null"] }
        last_status: { type: [string, "null"] }
    DeploymentInput:
      type: object
      required: [certificate_id, name, type, config]
      properties:
        certificate_id: { type: string }
        name: { type: string }
        type:
          type: string
          enum:
            - local_file
            - reload
            - webhook
            - ssh
            - baota_panel
            - baota_site
            - 1panel_panel
            - 1panel_site
            - tencent_cdn
            - tencent_waf
            - tencent_cos
            - tencent_teo
            - aliyun_cdn
            - aliyun_waf
            - aliyun_oss
            - aliyun_dcdn
            - qiniu_cdn
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
    DeploymentCredential:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [tencent, aliyun, qiniu, baota, "1panel", ssh] }
        configured_fields:
          type: array
          items: { type: string }
        public_config:
          type: object
          additionalProperties: true
        created_at: { type: integer }
        updated_at: { type: integer }
    DeploymentCredentialInput:
      type: object
      required: [name, type, config]
      properties:
        name: { type: string }
        type: { type: string, enum: [tencent, aliyun, qiniu, baota, "1panel", ssh] }
        config: { type: object, additionalProperties: true }
    NotificationChannel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [smtp, webhook, telegram, feishu, dingtalk, wecom] }
        events:
          type: array
          items: { type: string }
        enabled: { type: boolean }
    WorkflowStep:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [apply, deploy, notify, verify, wait] }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        when: { type: string, enum: [success, failure, always] }
        parallel_group: { type: string }
        continue_on_error: { type: boolean }
    WorkflowPosition:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
    WorkflowNode:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [apply, deploy, notify, verify, wait] }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        position: { $ref: "#/components/schemas/WorkflowPosition" }
        continue_on_error: { type: boolean }
    WorkflowEdge:
      type: object
      required: [from, to]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        condition: { type: string, enum: [success, failure, always] }
    WorkflowDefinition:
      type: object
      properties:
        version: { type: integer }
        steps:
          type: array
          description: Legacy v1 ordered steps.
          items: { $ref: "#/components/schemas/WorkflowStep" }
        nodes:
          type: array
          description: v2 graph nodes.
          items: { $ref: "#/components/schemas/WorkflowNode" }
        edges:
          type: array
          description: v2 graph edges.
          items: { $ref: "#/components/schemas/WorkflowEdge" }
        allow_multiple_starts:
          type: boolean
          description: Allow more than one root node. False by default so an unconnected node cannot become an accidental start node.
    WorkflowInput:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        description: { type: string }
        enabled:
          type: boolean
          description: Defaults to true on create; omitted on update preserves the current value.
        trigger_type: { type: string, enum: [manual, schedule] }
        schedule: { type: string }
        definition: { $ref: "#/components/schemas/WorkflowDefinition" }
    Workflow:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        definition: { $ref: "#/components/schemas/WorkflowDefinition" }
        enabled: { type: boolean }
        trigger_type: { type: string, enum: [manual, schedule] }
        schedule: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }
        last_run: { $ref: "#/components/schemas/WorkflowRun" }
    WorkflowRun:
      type: object
      properties:
        id: { type: string }
        workflow_id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, partial, canceled] }
        trigger_type: { type: string }
        error: { type: [string, "null"] }
        started_at: { type: [integer, "null"] }
        finished_at: { type: [integer, "null"] }
        created_at: { type: integer }
    WorkflowStepRun:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        step_id: { type: string }
        type: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, skipped, canceled] }
        attempts: { type: integer }
        job_ids:
          type: array
          items: { type: string }
        output: { type: object, additionalProperties: true }
        error: { type: [string, "null"] }
        started_at: { type: [integer, "null"] }
        finished_at: { type: [integer, "null"] }
        available_at:
          type: integer
          description: Unix time after which a pending step may be retried.
    WorkflowRunDetail:
      type: object
      properties:
        run: { $ref: "#/components/schemas/WorkflowRun" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStepRun" }
        log_url: { type: string }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        actor_id: { type: [string, "null"] }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, "null"] }
        result: { type: string, enum: [ok, denied, error] }
        ip: { type: [string, "null"] }
        created_at: { type: integer }
